name: release

on:
  push:
    # run only against tags
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild'
        required: true
        type: string

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PANEL_REPOSITORY: router-for-me/Home-Management-Center

jobs:
  build-management-panel:
    name: build embedded management panel
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Check panel repository token
        env:
          PANEL_REPOSITORY_TOKEN: ${{ secrets.HOME_MANAGEMENT_CENTER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PANEL_REPOSITORY_TOKEN}" ]]; then
            echo "HOME_MANAGEMENT_CENTER_TOKEN secret is required to read ${PANEL_REPOSITORY}" >&2
            exit 1
          fi
      - name: Build embedded management panel
        env:
          GH_TOKEN: ${{ secrets.HOME_MANAGEMENT_CENTER_TOKEN }}
        run: |
          set -euo pipefail
          gh repo clone "${PANEL_REPOSITORY}" /tmp/home-management-center -- --depth 1
          cd /tmp/home-management-center
          bun install --frozen-lockfile
          bun run build:embedded
          rm -rf "${GITHUB_WORKSPACE}/internal/managementasset/static"
          mkdir -p "${GITHUB_WORKSPACE}/internal/managementasset/static"
          touch "${GITHUB_WORKSPACE}/internal/managementasset/static/.gitkeep"
          cp -R dist/. "${GITHUB_WORKSPACE}/internal/managementasset/static/"
          test -s "${GITHUB_WORKSPACE}/internal/managementasset/static/management.html"
      - uses: actions/upload-artifact@v4
        with:
          name: management-panel-static
          path: internal/managementasset/static/**
          if-no-files-found: error

  prepare-release:
    needs: build-management-panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare release notes and draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          changelog_notes_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$changelog_notes_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'EOF'
          <!-- cliproxyapi-home-release-assets:start -->
          ## Linux release assets

          - `CLIProxyAPIHome_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
          - `CLIProxyAPIHome_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.

          ## FreeBSD release assets

          - `CLIProxyAPIHome_<version>_freebsd_amd64.tar.gz` is the FreeBSD amd64 build. It supports dynamic library plugins.
          - `CLIProxyAPIHome_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.

          <!-- cliproxyapi-home-release-assets:end -->
          EOF

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${RELEASE_TAG}"
          else
            changelog_range="$RELEASE_TAG"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true

          gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            --jq .body > "$generated_notes_file"
          if [[ ! -s "$generated_notes_file" ]]; then
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$RELEASE_TAG" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GH_REPO" "$RELEASE_TAG" > "$generated_notes_file"
            fi
          fi

          {
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$changelog_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            cat "$changelog_notes_file"
          } > "$updated_notes_file"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$updated_notes_file"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$updated_notes_file"
          fi

  build-hosted:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Refresh models catalog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@v4
        with:
          name: management-panel-static
          path: internal/managementasset/static
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPIHome_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/home/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPIHome_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPIHome_*.tar.gz dist/CLIProxyAPIHome_*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Refresh models catalog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/download-artifact@v4
        with:
          name: management-panel-static
          path: internal/managementasset/static
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPIHome_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_version="$(sed -n "s/^go //p" go.mod)"
              test -n "$go_version"
              go_archive="go${go_version}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"
              export GOTOOLCHAIN=local

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/home/

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPIHome_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPIHome_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Refresh models catalog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - uses: actions/download-artifact@v4
        with:
          name: management-panel-static
          path: internal/managementasset/static
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPIHome_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/home/

          if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/cli-proxy-api" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPIHome_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPIHome_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Fetch tags
        run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - uses: actions/download-artifact@v4
        with:
          name: management-panel-static
          path: internal/managementasset/static
      - name: Generate Build Metadata
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld curl xz-utils
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        timeout-minutes: 45
        shell: bash
        env:
          FREEBSD_BASE_SHA256: e38b5cf756d60086a6c2f736eff19cc7685f7e2313e31d14342fc8df57200a92
        run: |
          set -euo pipefail
          sysroot_dir="${RUNNER_TEMP}/freebsd-${GOARCH}-14.3"
          base_archive="${RUNNER_TEMP}/freebsd-${GOARCH}-base.txz"
          curl -fL --retry 3 \
            https://archive.freebsd.org/old-releases/amd64/14.3-RELEASE/base.txz \
            -o "$base_archive"
          printf '%s  %s\n' "$FREEBSD_BASE_SHA256" "$base_archive" | sha256sum --check
          mkdir -p "$sysroot_dir" "dist/${TARGET}/bin"
          tar --no-same-owner -xJf "$base_archive" -C "$sysroot_dir" ./lib ./usr/include ./usr/lib

          CGO_ENABLED=1 GOOS=freebsd GOARCH="$GOARCH" \
            CC="clang --target=x86_64-unknown-freebsd14.3 --sysroot=${sysroot_dir}" \
            CGO_LDFLAGS=-fuse-ld=lld \
            go build -buildvcs=false \
              -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
              -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/home/
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/home/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPIHome_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/cli-proxy-api" "$archive_dir/cli-proxy-api"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPIHome_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPIHome_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify archives and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPIHome_*.tar.gz CLIProxyAPIHome_*.zip)
          if [[ ${#archives[@]} -ne 10 ]]; then
            printf 'Expected 10 release archives, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          gh release upload "$RELEASE_TAG" checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
