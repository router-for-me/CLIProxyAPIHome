name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: home_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOME_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/home_test?sslmode=disable
      CLIPROXY_HOME_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/home_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify cluster and management behavior
        run: go test -v ./internal/cluster/...
      - name: Build
        run: |
          CGO_ENABLED=1 go build -o test-output ./cmd/home
          rm -f test-output
